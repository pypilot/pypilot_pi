---
clone_folder: c:\project\opencpn\plugin_src
shallow_clone: false
clone_depth: 10

image:
  - Visual Studio 2022

platform:
  - Win32

# Host-side packaging tools need current 64-bit Python wheels. The plugin
# target remains Win32, selected by vcvars32 and CMake -A Win32.
environment:
  PYTHON: C:\Python312-x64

configuration: RelWithDebInfo
test: false

before_build:
  - git submodule update --init opencpn-libs
  - set "VS_HOME=C:\Program Files\Microsoft Visual Studio\2022"
  - call "%VS_HOME%\Community\VC\Auxiliary\Build\vcvars32.bat"

build_script:
  - call ci\appveyor.bat
